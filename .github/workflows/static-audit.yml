name: Static audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Audit source
        run: ./scripts/audit-source.sh

      - name: Public-boundary regression tests
        run: ./tests/test-public-boundary.sh

      - name: Reproducible-package test
        run: ./tests/test-reproducible-package.sh

      - name: Package release
        run: ./scripts/package-release.sh
